name: Validate and package

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is build-only compatibility; frontend registerHooks needs >=22.15.0.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm vendor
      - name: Require Node >=22.15 registerHooks for frontend tests
        if: matrix.node == '22'
        run: node --input-type=module -e "import { registerHooks } from 'node:module'; if (typeof registerHooks !== 'function') process.exit(1)"
      - name: Validate all tests on current Node 22 (>=22.15.0)
        if: matrix.node == '22'
        run: pnpm validate
      - name: Node 20 build compatibility (frontend tests require Node >=22.15)
        if: matrix.node == '20'
        run: |
          pnpm typecheck
          pnpm test:backend
          pnpm test:packaging
          pnpm test:automation
          pnpm build
      - name: Verify complete ESM release inputs and archive
        run: |
          python3 scripts/package.py --check
          pnpm package
          python3 scripts/package.py --verify out/bluetooth-order.zip
          cd out && sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.node == '22'
        with:
          name: bluetooth-order
          path: |
            out/bluetooth-order.zip
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
