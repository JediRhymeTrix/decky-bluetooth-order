name: Tagged release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable tag to retry (for example v0.1.0; never a branch or SHA)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
      tag-object: ${{ steps.tag.outputs.tag-object }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact existing tag/version and curated notes
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          python3 scripts/release_metadata.py "$RELEASE_TAG"
          git check-ref-format "refs/tags/$RELEASE_TAG"
          tag_object=$(git show-ref --verify --hash "refs/tags/$RELEASE_TAG")
          commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          test "$(git rev-parse HEAD)" = "$commit"
          if [[ "$EVENT_NAME" == push ]]; then
            test "$commit" = "$EVENT_SHA"
          fi
          printf 'tag=%s\ncommit=%s\ntag-object=%s\n' "$RELEASE_TAG" "$commit" "$tag_object" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22' # Current Node 22, minimum 22.15.0 for module.registerHooks.
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm vendor
      - name: Require Node >=22.15 registerHooks for frontend tests
        run: node --input-type=module -e "import { registerHooks } from 'node:module'; if (typeof registerHooks !== 'function') process.exit(1)"
      - run: pnpm validate
      - run: pnpm package
      - name: Verify archive and checksum
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 scripts/release_metadata.py "$RELEASE_TAG" --archive out/bluetooth-order.zip
          cd out && sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            out/bluetooth-order.zip
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: python3 scripts/release_metadata.py "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: out
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22' # Same current LTS as the build job (>=22.15.0).
      - name: Recheck complete archive and checksum
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          python3 scripts/release_metadata.py "$RELEASE_TAG" --archive out/bluetooth-order.zip
          cd out && sha256sum --check SHA256SUMS
      - name: Stage a new draft with exactly one ZIP and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.build.outputs.tag-object }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$RELEASE_TAG_OBJECT"
          # Never edit an existing release, even a draft left by an interrupted run.
          # Review/delete that draft manually, then retry the same unchanged tag.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq -- "$RELEASE_TAG" "$RUNNER_TEMP/release-tags"; then
            echo "Release already exists for $RELEASE_TAG; refusing to replace any assets." >&2
            exit 1
          fi
          args=(--verify-tag --draft --notes-file "$RUNNER_TEMP/release-notes.md" --title "Bluetooth Order $RELEASE_TAG" --latest=false)
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" out/bluetooth-order.zip out/SHA256SUMS "${args[@]}"
      - name: Verify uploaded draft assets and publish last
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.build.outputs.tag-object }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          gh release download "$RELEASE_TAG" --pattern bluetooth-order.zip --pattern SHA256SUMS --dir "$RUNNER_TEMP/verified-assets"
          cmp out/bluetooth-order.zip "$RUNNER_TEMP/verified-assets/bluetooth-order.zip"
          cmp out/SHA256SUMS "$RUNNER_TEMP/verified-assets/SHA256SUMS"
          (cd "$RUNNER_TEMP/verified-assets" && sha256sum --strict --check SHA256SUMS)
          python3 scripts/release_metadata.py "$RELEASE_TAG" --archive "$RUNNER_TEMP/verified-assets/bluetooth-order.zip"
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$RELEASE_TAG_OBJECT"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName,assets,body > "$RUNNER_TEMP/draft.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          draft = json.loads((root / "draft.json").read_text())
          if (draft["isDraft"] is not True
                  or draft["tagName"] != os.environ["RELEASE_TAG"]
                  or draft["isPrerelease"] != (os.environ["PRERELEASE"] == "true")
                  or sorted(asset["name"] for asset in draft["assets"]) != ["SHA256SUMS", "bluetooth-order.zip"]
                  or draft["body"].strip() != (root / "release-notes.md").read_text().strip()):
              raise SystemExit("Draft metadata/assets differ; refusing to publish")
          PY
          args=(--draft=false)
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--prerelease=false --latest)
          fi
          gh release edit "$RELEASE_TAG" "${args[@]}"
